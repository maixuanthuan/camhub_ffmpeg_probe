name: camhub          # tên project cố định (không lấy theo tên thư mục "hub")

services:

  camhub:
    build: .
    image: camhub:1.0
    container_name: camhub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # Đổi màu trên GPU: 1 = bật (mặc định), 0 = tắt hẳn (đổi màu CPU như cũ)
      - CAMHUB_GPU_COLOR=1
      # Mode nào đổi màu trên GPU. "tv" giống CPU từng bit; "bgr24" lệch TB ~0.6 mức.
      # Project nào nhạy màu với bgr24 → để "tv" (bgr24 về CPU)
      - CAMHUB_GPU_MODES=tv,bgr24
      - CAMHUB_ENV=/app/hub/camhub.env
    volumes:
      - /dev/shm/camhub:/camhub                      # chỗ chia frame cho các project
      # Mount CẢ THƯ MỤC camhub/ (không mount từng file): rsync/editor thay file bằng file
      # mới, mount từng file thì container vẫn thấy file cũ → sửa camhub.env không ăn.
      # /app/hub: hub.py, camhub.env (hub tự đọc lại khi đổi) · /app: camhub_client.py (chạy thử)
      - ../:/app:ro
      - /etc/localtime:/etc/localtime:ro             # log đúng giờ VN
    working_dir: /app/hub
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
